<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estúdio de Criativos — ferramentas para tráfego pago</title>
  <meta name="description" content="Redimensione criativos (9:16, 4:5, 1:1, 16:9), adicione legenda e marca d'água, extraia texto de prints e use fontes para copy. Grátis com limite diário; Pro R$ 29,90 por 30 dias via Pix." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">EC</span>
      <div class="brand-txt">
        <strong>Estúdio de Criativos</strong>
        <small>ferramentas para quem roda tráfego pago</small>
      </div>
    </div>
    <div id="plan-chip" class="chip"></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Ferramentas">
    <button class="tab is-active" data-tab="resizer">Redimensionar</button>
    <button class="tab" data-tab="watermark">Legenda &amp; Marca d’água</button>
    <button class="tab" data-tab="ocr">Print → Texto</button>
    <button class="tab" data-tab="fonts">Fontes p/ Copy</button>
    <button class="tab tab-pro" data-tab="pro">Pro · R$ 29,90</button>
  </nav>

  <main id="view" class="view"></main>

  <footer class="foot">
    <span>⚡ Processamento 100% no seu navegador — suas imagens não saem do dispositivo.</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
